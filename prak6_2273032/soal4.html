<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>2273032-aditya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .box {
      width: 350px;
      border: 1px solid #ccc;
      padding: 15px;
      margin: 20px;
      background: #f7f7f7;
      box-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    .row {
      margin-bottom: 10px;
    }

    label {
      display: inline-block;
      width: 70px;
      color: blue;
      font-weight: bold;
    }

    .colon {
      display: inline-block;
      width: 10px;
      text-align: center;
    }

    input {
      width: 220px;
      padding: 3px;
    }

    select {
      width: 100%;
      margin-top: 8px;
      padding: 3px;
    }

    .btn-group {
      margin-top: 10px;
    }

    button {
      width: 100px;
      padding: 5px;
      margin-right: 10px;
    }
  </style>
</head>

<body>

<div class="box">
  <div class="row">
    <label>Input</label>
    <span class="colon">:</span>
    <input type="text" id="input">
  </div>

  <div class="row">
    <label>Output</label>
    <span class="colon">:</span>
    <input type="text" id="output" readonly>
  </div>

  <select id="mode">
    <option value="dec2bin">decimal-biner</option>
    <option value="bin2dec">biner-decimal</option>
  </select>

  <div class="btn-group">
    <button onclick="proses()">PROSES</button>
    <button onclick="resetForm()">RESET</button>
  </div>
</div>

<script>
function proses() {
  var input = document.getElementById("input").value.trim();
  var mode = document.getElementById("mode").value;

  if (mode === "dec2bin") {
    var num = parseInt(input);

    if (input === "" || isNaN(num) || num < 0 || num > 255) {
      alert("Input harus angka 0 - 255");
      return;
    }

    // konversi manual decimal ke biner
    var hasil = "";
    var temp = num;

    do {
      hasil = (temp % 2) + hasil;
      temp = Math.floor(temp / 2);
    } while (temp > 0);

    document.getElementById("output").value = hasil;
  } 
  else {
    
    if (!/^[01]{1,8}$/.test(input)) {
      alert("Input harus biner (0/1 maksimal 8 digit)");
      return;
    }

    // konversi manual biner ke decimal
    var hasil = 0;
    var panjang = input.length;

    for (var i = 0; i < panjang; i++) {
      if (input[i] === "1") {
        hasil += Math.pow(2, panjang - i - 1);
      }
    }

    document.getElementById("output").value = hasil;
  }
}

function resetForm() {
  document.getElementById("input").value = "";
  document.getElementById("output").value = "";
}
</script>

</body>
</html>
