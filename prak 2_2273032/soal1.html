<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>2273032-adityappr</title>
  <style>
    body{
      font-family: "Times New Roman", Times, serif;
      background:#fff;
    }

    table{ border-collapse:collapse; }
    .frame{
      border:2px solid #000;
      margin:40px auto;
    }
    .frame td{
      border:2px solid #000;
      text-align:center;
      font-weight:bold;
      font-size:18px;
    }

    /* warna */
    .blue{ background:#00f; color:#000; }
    .red{ background:#f00; color:#000; }
    .green{ background:#00ff00; color:#000; }
    .yellow{ background:#ff0; color:#000; }
    .black{ background:#000; color:#fff; }

    /* ukuran (biar proporsinya mirip gambar) */
    .gcol{ width:80px; }
    .dcol{ width:80px; }

    .a{ height:60px; }
    .b{ height:55px; }
    .c{ width:90px; }
    .f{ width:70px; }
    .x{ width:80px; height:55px; }
    .e{ height:55px; }
    .h{ height:60px; }
  </style>
</head>

<body>
  <!-- OUTER TABLE: G | (tabel tengah) | D -->
  <table class="frame" cellspacing="0" cellpadding="0">
    <tr>
      <td class="yellow gcol" rowspan="5">G</td>
      <td colspan="3" class="blue a">A</td>
      <td class="yellow dcol" rowspan="5">D</td>
    </tr>

    <tr>
      <td class="red b" colspan="2">B</td>
      <td class="green c" rowspan="2">C</td>
    </tr>

    <tr>
      <td class="green f" rowspan="2">F</td>
      <td class="black x">X</td>
    </tr>

    <tr>
      <td class="red e" colspan="2">E</td>
    </tr>

    <tr>
      <td class="blue h" colspan="3">H</td>
    </tr>
  </table>


</body>
</html>
