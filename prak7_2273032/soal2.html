<!DOCTYPE html>
<html>
<head>
    <title>2273032-aditya</title>
    <style>
        table {
            border-collapse: collapse;
            width: 400px;
            text-align: center;
            font-family: Arial;
        }

        th {
            background-color: #d9ead3;
            padding: 8px;
        }

        td {
            padding: 8px;
        }

    
        .row1 { background-color: #9fc5e8; }
        .row2 { background-color: #f9cb9c; }

        
        .hovered {
            background-color: #CCFFAA !important;
        }
    </style>

    <script>
        function highlightRow(row) {
            row.classList.add("hovered");
        }

        function unhighlightRow(row) {
            row.classList.remove("hovered");
        }
    </script>
</head>

<body>

<table border="1">
    <tr>
        <th>Position</th>
        <th>Programming Language</th>
        <th>Ratings</th>
    </tr>

    <tr class="row1" onmouseover="highlightRow(this)" onmouseout="unhighlightRow(this)">
        <td>1</td>
        <td>C</td>
        <td>18.058%</td>
    </tr>

    <tr class="row2" onmouseover="highlightRow(this)" onmouseout="unhighlightRow(this)">
        <td>2</td>
        <td>Java</td>
        <td>18.051%</td>
    </tr>

    <tr class="row1" onmouseover="highlightRow(this)" onmouseout="unhighlightRow(this)">
        <td>3</td>
        <td>C++</td>
        <td>9.707%</td>
    </tr>

    <tr class="row2" onmouseover="highlightRow(this)" onmouseout="unhighlightRow(this)">
        <td>4</td>
        <td>PHP</td>

    </tr>

    <tr class="row1" onmouseover="highlightRow(this)" onmouseout="unhighlightRow(this)">
        <td>5</td>

        <td>6.392%</td>
    </tr>
</table>

</body>
</html>
