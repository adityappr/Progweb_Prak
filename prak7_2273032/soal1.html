<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2273032-aditya</title>
  <style>
    body {
      font-family: "Times New Roman", serif;
      font-size: 16px;
      margin: 20px;
    }

    .box {
      width: 330px;
      padding: 14px 16px;
      border: 1px solid #ccc;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      background: #fff;
    }

    .row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .row label {
      width: 75px;
    }

    .colon {
      width: 15px;
      text-align: center;
    }

    input[type="text"] {
      width: 235px;
      height: 24px;
      box-sizing: border-box;
    }

    .textarea-wrap {
      position: relative;
      width: 235px;
    }

    textarea {
      width: 235px;
      height: 115px;
      resize: none;
      box-sizing: border-box;
      padding: 4px;
      font-family: "Courier New", monospace;
      font-size: 14px;
    }

    #txt2 {
      position: absolute;
      right: 0;
      bottom: -30px;
      width: 60px;
      height: 24px;
      text-align: right;
      box-sizing: border-box;
    }

    .spacer {
      height: 25px;
    }
  </style>
  <script>
    function call_onKeyPress(ob) {
      let obval = ob.value;

      if (obval.length > 256) {
        ob.value = obval.substr(0, 256);
        obval = ob.value;
      }

      document.getElementById("txt2").value = obval.length + "/256";
    }
  </script>
</head>
<body>
  <div class="box">
    <div class="row">
      <label for="judul">Judul</label>
      <div class="colon">:</div>
      <input type="text" id="judul" />
    </div>

    <div class="row">
      <label for="deskripsi">Deskripsi</label>
      <div class="colon">:</div>
      <div class="textarea-wrap">
        <textarea
          id="deskripsi"
          onkeyup="call_onKeyPress(this)"
          onkeydown="call_onKeyPress(this)"
        ></textarea>
        <input type="text" id="txt2" value="0/256" readonly />
      </div>
    </div>

    <div class="spacer"></div>
  </div>
</body>
</html>
