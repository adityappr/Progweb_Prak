<!DOCTYPE html>
<html>
<head>
<title>Happy Hamburger</title>

<style>
body {
  margin: 0;
  background: #f2f2f2;
  font-family: Roboto, Arial, sans-serif;
}

/* CONTAINER */
.container {
  width: 900px;
  margin: 20px auto;
  border: 2px solid #888;
  background: #f2f2f2;
}

/* HEADER */
.header {
  background: #F09C1D;
  color: #402D26;
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  padding: 10px 0;
}

/* CONTENT */
.content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 40px 80px;
}

/* BURGER */
.burger {
  border-collapse: collapse;
}

.burger td {
  width: 24px;
  height: 24px;
  padding: 0;
}

/* COLORS */
.o { background: #402D26; }
.b { background: #F09C1D; }
.w { background: #FFFFFF; }
.r { background: #F0212E; }
.m { background: #785010; }
.g { background: #91E81C; }

/* INGREDIENT BOX */
.ingredients {
  width: 230px;
  background: #F09C1D;
  border-radius: 8px;
  padding: 20px;
  color: white;
  font-family: Georgia;
}

.ingredients h3 {
  text-align: center;
  color: #402D26;
  margin-bottom: 15px;
  font-size: 20px;
}

.ingredients ul {
  margin: 0;
  padding-left: 18px;
  line-height: 1.8;
}

.ingredients span {
  float: right;
}
</style>

</head>

<body>

<div class="container">

<div class="header">Happy Hamburger</div>

<div class="content">

<!-- BURGER -->
<table class="burger">
<tr>
<td></td><td></td><td></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td></td><td></td><td></td>
</tr>

<tr>
<td></td><td></td><td class="o"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="o"></td><td></td><td></td>
</tr>

<tr>
<td></td><td class="o"></td><td class="b"></td><td class="b"></td><td class="w"></td><td class="o"></td><td class="b"></td><td class="b"></td><td class="w"></td><td class="o"></td><td class="b"></td><td class="o"></td><td></td>
</tr>

<tr>
<td class="o"></td><td class="b"></td><td class="b"></td><td class="r"></td><td class="r"></td><td class="b"></td><td class="b"></td><td class="o"></td><td class="b"></td><td class="r"></td><td class="r"></td><td class="b"></td><td class="o"></td>
</tr>

<tr>
<td class="o"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="b"></td><td class="o"></td>
</tr>

<tr>
<td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td><td class="o"></td>
</tr>

<tr>
<td></td><td class="o"></td><td class="m"></td><td class="m"></td><td class="m"></td><td class="m"></td><td class="m"></td><td class="m"></td><td class="m"></td><td class="m"></td><td class="m"></td><td class="o"></td><td></td>
</tr>

<tr>

</body>
</html>
