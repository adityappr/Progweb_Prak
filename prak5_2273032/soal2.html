<!DOCTYPE html>
<html>
<head>
    <title>2273032-Aditya</title>
    <style>
        .container {
            position: relative;
            width: 500px;
            height: 250px;
            padding: 40px;
        }

        .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: absolute;
            background: transparent;
        }

        .left {
            border: 7px solid #FF0000;
            left: 40px;
            top: 40px;
            z-index: 1;
        }

        .middle {
            border: 7px solid #6A0DAD;
            left: 140px;
            top: 40px;
            z-index: 2;
        }

        .right {
            border: 7px solid #FF0000;
            left: 240px;
            top: 40px;
            z-index: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="circle left"></div>
    <div class="circle middle"></div>
    <div class="circle right"></div>
</div>

</body>
</html>
