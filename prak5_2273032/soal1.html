<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>2273032-aditya</title>
  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;
      background: #fff;
    }

    .wrapper {
      width: 760px;
      margin: 40px auto;
      text-align: center;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
    }

    td {
      vertical-align: middle;
      padding: 0 18px;
    }

    .star-box {
      width: 220px;
      height: 220px;
      position: relative;
      display: inline-block;
    }

    .star-box img {
      width: 120px;
      position: absolute;
      top: 48px;
      left: 50px;
    }

    .corner {
      width: 28px;
      height: 28px;
      position: absolute;
    }

    .tl {
      top: 18px;
      left: 18px;
      border-top: 5px solid #ff0000;
      border-left: 5px solid #ff0000;
    }

    .tr {
      top: 18px;
      right: 18px;
      border-top: 5px solid #ff0000;
      border-right: 5px solid #ff0000;
    }

    .bl {
      bottom: 18px;
      left: 18px;
      border-bottom: 5px solid #ff0000;
      border-left: 5px solid #ff0000;
    }

    .br {
      bottom: 18px;
      right: 18px;
      border-bottom: 5px solid #ff0000;
      border-right: 5px solid #ff0000;
    }

    .star-box:hover .corner {
      border-color: #ff00ff;
    }

    
    .hovered .tl,
    .hovered .tr,
    .hovered .bl,
    .hovered .br {
      border-color: #ff00ff;
    }

    .arrow-link {
      display: inline-block;
      position: relative;
      background: #c9d79a;
      color: #0000cc;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      padding: 14px 26px;
      border: 4px solid #e8e8d8;
      box-shadow: 2px 2px 0 #9ca36f;
    }

    .arrow-link::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -34px;
      transform: translateY(-50%);
      border-top: 33px solid transparent;
      border-bottom: 33px solid transparent;
      border-left: 34px solid #c9d79a;
      filter: drop-shadow(4px 0 0 #e8e8d8) drop-shadow(6px 0 0 #9ca36f);
    }

    .arrow-link:hover {
      color: #cc0000;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table>
      <tr>
        <td>
          <div class="star-box">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <img src="src/star.jpg" alt="Star">
</body>
</html>
