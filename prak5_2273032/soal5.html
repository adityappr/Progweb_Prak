<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>2273032-aditya</title>
  <style>
    body {
      font-family: "Times New Roman", serif;
      margin: 50px;
    }

    ul.menu, ul.submenu {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    ul.menu > li {
      float: left;
      position: relative;
      margin-right: 3px; /* jarak antar li = 3 pixel */
    }

    ul.menu > li > a {
      display: block;
      width: 140px;
      text-align: center;
      padding: 10px 0;
      text-decoration: none;
      color: black;
      border: 2px dotted grey;
      background: white;
      font-size: 18px;
    }

    ul.menu > li > a:hover {
      background: black;
      color: white;
    }

    ul.submenu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
    }

    ul.submenu li a {
      display: block;
      width: 140px;
      text-align: center;
      padding: 8px 0;
      text-decoration: none;
      color: black;
      border: 2px dotted grey;
      background: white;
      font-size: 18px;
    }

    ul.submenu li a:hover {
      background: black;
      color: white;
    }

    ul.menu li:hover .submenu {
      display: block;
    }

    .clear {
      clear: both;
    }
  </style>
</head>
<body>

  <ul class="menu">
    <li><a href="#">Home</a></li>
    <li>
      <a href="#">News</a>
      <ul class="submenu">
        <li><a href="#">Sports</a></li>
        <li><a href="#">Music</a></li>
        <li><a href="#">Movie</a></li>
      </ul>
    </li>
    <li><a href="#">Contact</a></li>
    <li><a href="#">About</a></li>
  </ul>
  <div class="clear"></div>

</body>
</html>
