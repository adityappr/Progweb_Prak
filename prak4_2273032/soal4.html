<!DOCTYPE html>
<html>
<head>
    <title>2273032-aditya</title>
    <style>
        body {
            margin: 0;
            background: #990000;
            font-family: Georgia, serif;
            color: white;
        }

        .box {
            width: 235px;
            margin: 25px 0 0 35px;
            padding: 10px;
            background:
                url('img/box_tl.gif') top left no-repeat,
                url('img/box_tr.gif') top right no-repeat,
                url('img/box_bl.gif') bottom left no-repeat,
                url('img/box_br.gif') bottom right no-repeat,
                url('img/box_t.gif') top repeat-x,
                url('img/box_b.gif') bottom repeat-x,
                url('img/box_l.gif') left repeat-y,
                url('img/box_r.gif') right repeat-y;
        }

        
        .inner {
            background: #7a0000;
            padding: 14px 16px 12px 16px;
            min-height: 210px;
        }

        h2 {
            margin: 0 0 18px 0;
            font-size: 24px;
            font-weight: bold;
        }

        p {
            margin: 0;
            font-size: 14px;
            line-height: 1.35;
        }

        .more {
            margin-top: 18px;
            text-align: right;
        }

        .more a {
            color: orange;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .more a:hover {
            color: green;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="inner">
            <h2>12.02.2011</h2>
            <p>
                Satu per satu para pesaing<br>
                Manchester United mulai<br>
                menunjukkan tanda-tanda<br>
                "menyerah". Kini tinggal..
            </p>
            <div class="more">
                <a href="#">more</a>
            </div>
        </div>
    </div>
</body>
</html>
